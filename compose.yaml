services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    environment:
      SIMULATOR_PASSWORD: ${SIMULATOR_PASSWORD:-simulator-demo}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - broker-data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mosquitto_sub -h localhost -u teacher -P "$$TEACHER_PASSWORD" -t ''$$SYS/broker/version'' -C 1 -W 3 >/dev/null',
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  simulator:
    build: .
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: simulator
      MQTT_PASSWORD: ${SIMULATOR_PASSWORD:-simulator-demo}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-2}
    volumes:
      - ./devices.json:/app/devices.json:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    init: true

  tools:
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "tools.cli"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: teacher
      MQTT_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
    depends_on:
      mosquitto:
        condition: service_healthy

  tests:
    build: .
    profiles: ["test"]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: teacher
      MQTT_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
      RUN_INTEGRATION: "1"
    depends_on:
      mosquitto:
        condition: service_healthy
      simulator:
        condition: service_started

  postgres:
    image: timescale/timescaledb-ha:pg17-all-arm64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-iot}",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6378}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_HOST: mosquitto
      MQTT_USER: backend
      MQTT_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
    volumes:
      - backend-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  subscriber:
    build: ./backend
    env_file: ./backend/.env
    command: ["php", "artisan", "mqtt:subscribe"]
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_HOST: mosquitto
      MQTT_USER: backend
      MQTT_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
      MQTT_ENABLE_LOGGING: "false"
      LOG_LEVEL: error
    volumes:
      - backend-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/app/public:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  broker-data:
  postgres-data:
  redis-data:
  backend-storage:
